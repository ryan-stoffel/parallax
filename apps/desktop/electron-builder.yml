# The installer for the current OS and arch (0029). scripts/ci/package-app builds plxd and the
# app's dist/ first, and passes the arch and version on the command line.
appId: dev.parallax.desktop
productName: Parallax
directories:
  output: release
# Where the app's updater (electron-updater, PLX-68) looks: the app ships this as app-update.yml
# in its resources folder, and the build writes the channel's update metadata next to the
# installers (0030). `${channel}` is the version's first prerelease identifier, or `latest`:
# nightly builds write nightly*.yml, standard builds latest*.yml. The owner and repo are explicit
# because electron-builder can't find the repo from apps/desktop (no .git there), and a GitHub
# config it can't resolve crashed the build ("reading 'channel'"). CI runs with --publish never;
# release.yml attaches the files.
publish:
  provider: github
  owner: ryan-stoffel
  repo: parallax
  channel: ${channel}
# node-pty ships prebuilt binaries for every target, so nothing needs compiling. @electron/rebuild
# would fetch Electron's headers and run node-gyp anyway on some runners.
npmRebuild: false
# dist/ is the whole app: vite.config.ts bundles every dependency except node-pty. Only
# `dependencies` are packaged, and package.json keeps just that one there. Sourcemaps stay out:
# nothing enables them at run time. node-pty keeps only the prebuild for this build's OS and arch
# (`${platform}` is the build machine's, and package-app builds for its own arch), the only one
# it loads.
files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!node_modules/node-pty/prebuilds/!(${platform}-${arch})/**"
# Native code can't load from inside app.asar: node-pty's prebuilds and spawn-helper.
asarUnpack:
  - node_modules/node-pty/**
# plxd, built for this target, and plxd.version, the version it reports (0030), go in the
# resources folder, where findPlxd looks. package-app puts both in target/package-resources.
extraResources:
  - from: ../../target/package-resources
    to: .
artifactName: parallax-${version}-${os}-${arch}.${ext}
# The updater installs from the zip; the dmg is for first installs. Signing happens only when
# CSC_KEYCHAIN (or CSC_LINK) is set (release.yml's macOS build): everything in the bundle, plxd
# included, gets the hardened runtime and a secure timestamp. electron-builder notarizes only when
# the APPLE_API_* variables are set too, which release.yml doesn't do: it notarizes the dmg after
# publishing (0030).
mac:
  target: [dmg, zip]
  # The full-bleed dark tile from the icon kit (design/icon/README.md).
  icon: ../../design/icon/icns/Parallax-dark.icns
  category: public.app-category.developer-tools
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Chromium's 223 .pak files (locales and resources) aren't code, so they aren't signed one by one (each a codesign
  # run and a trip to Apple's timestamp server, about two minutes in all): Electron Framework's own
  # signature seals them as resources, like every other data file (PLX-211).
  signIgnore: ['\.pak$']
# Signed with the app's identity when there is one. The updater reads the zip, so the dmg stays out
# of the update metadata.
dmg:
  sign: true
  writeUpdateInfo: false
win:
  target: nsis
linux:
  target: AppImage
  category: Development
