# One package, not a workspace (0022). This file exists because pnpm 11
# reads these settings only from here, not from package.json.
#
# Electron 44 has no install script. It downloads its binary the first time
# `electron` is required (scripts/dev.mjs does that).
allowBuilds:
  # Squirrel.Windows, which electron-builder only uses for a target we don't build.
  electron-winstaller: false
  # Enriched Markdown's native assets (tree-sitter grammars, RaTeX), which only the phone builds.
  react-native-enriched-markdown: false

# Vite+ asks for these so every tool shares its Vite and Vitest.
overrides:
  # Enriched Markdown's web build needs only Platform and processColor from React Native
  # (shims/react-native), so no copy of React Native itself comes with it.
  react-native: link:./shims/react-native
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vitest: 5.0.1

# Enriched Markdown's web renderer parses only after a render, so a message's first frame was empty
# and a virtualized transcript measured it at that height. The patch parses in the render once the
# parser has loaded (MarkdownText, AgentChat.tsx). It also adds `renderLinkContent`, which draws
# an icon before a link's text. Both worth offering upstream.
patchedDependencies:
  react-native-enriched-markdown@1.2.0-nightly-20261022-ca155ffee: patches/react-native-enriched-markdown@1.2.0-nightly-20261022-ca155ffee.patch

# Vite+ core is Vite 8 under its own version number, so Vite plugins'
# `vite@^8` peer ranges don't match it.
peerDependencyRules:
  allowAny:
    - vite
