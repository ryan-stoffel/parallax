<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Parallax</title>
    <!-- The pairing screen's look, before the app's styles load with the app. -->
    <style>
      /* The app's tokens and onboarding look (index.css), scoped so nothing reaches the app. */
      #pair {
        --bg: #fff;
        --surface: #fff;
        --fg: #1e1b4b;
        --muted: #4a4868;
        --line: rgb(30 27 75 / 10%);
        --primary: #1e1b4b;
        --on-primary: #fff;
        --accent: #2b5cff;
        --danger: #d4330f;
        --overlap: #1e1b4b;
        --shadow: 0 10px 30px -16px rgb(30 27 75 / 22%);
        display: none;
        position: fixed;
        inset: 0;
        overflow: auto;
        grid-template-rows: auto 1fr;
        color-scheme: light dark;
        color: var(--fg);
        background: var(--bg);
        font:
          14px/1.5 "Inter Variable",
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        #pair {
          --bg: #000;
          --surface: #0e0e0e;
          --fg: #e8e8e8;
          --muted: #a3a3a3;
          --line: rgb(255 255 255 / 10%);
          --primary: #e8e8e8;
          --on-primary: #000;
          --accent: #5b80ff;
          --danger: #ff6b4a;
          --overlap: #e4e4e7;
          --shadow: 0 14px 36px -18px rgb(0 0 0 / 80%);
        }
      }
      #pair header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 16px 20px;
        color: var(--muted);
      }
      #pair header svg:first-child {
        width: 16px;
        height: 16px;
      }
      #pair header svg:last-child {
        width: auto;
        height: 10px;
        overflow: visible;
      }
      #pair form {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(520px, 100%);
        margin: auto;
        padding: 16px;
        text-align: center;
        animation: pair-rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #pair .hero {
        position: relative;
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        margin-bottom: 24px;
      }
      #pair .hero svg {
        position: relative;
        width: 96px;
        height: 96px;
      }
      #pair .glow {
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        filter: blur(40px);
        animation: pair-glow 6s ease-in-out infinite alternate;
      }
      #pair .glow.blue {
        top: 8px;
        left: 8px;
        background: rgb(43 92 255 / 40%);
      }
      #pair .glow.coral {
        right: 8px;
        bottom: 8px;
        background: rgb(255 74 31 / 40%);
        animation-delay: -3s;
      }
      #pair .meet-blue {
        animation: pair-meet-blue 1.1s cubic-bezier(0.34, 1.3, 0.64, 1) both;
      }
      #pair .meet-coral {
        animation: pair-meet-coral 1.1s cubic-bezier(0.34, 1.3, 0.64, 1) both;
      }
      @keyframes pair-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes pair-glow {
        to {
          opacity: 0.5;
          scale: 1.25;
        }
      }
      @keyframes pair-meet-blue {
        from {
          opacity: 0;
          translate: -6px -6px;
        }
      }
      @keyframes pair-meet-coral {
        from {
          opacity: 0;
          translate: 6px 6px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pair * {
          animation: none !important;
        }
      }
      #pair h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      #pair p {
        margin: 8px 0 0;
        max-width: 448px;
        color: var(--muted);
        text-wrap: balance;
      }
      #pair input {
        box-sizing: border-box;
        align-self: stretch;
        margin-top: 36px;
        padding: 14px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: 0;
        color: var(--fg);
        background: var(--surface);
        box-shadow: var(--shadow);
        font:
          18px/1.5 "JetBrains Mono",
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.15em;
        text-align: center;
        text-transform: uppercase;
      }
      #pair input::placeholder {
        color: var(--muted);
        opacity: 0.5;
      }
      #pair input:focus-visible {
        border-color: var(--accent);
      }
      #pair button {
        width: 100%;
        margin-top: 12px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        color: var(--on-primary);
        background: var(--primary);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        cursor: pointer;
      }
      #pair button:hover:enabled {
        opacity: 0.9;
      }
      #pair button:disabled {
        opacity: 0.5;
      }
      #pair button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #pair [role="alert"] {
        min-height: 40px;
        margin-top: 12px;
        color: var(--danger);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <main id="pair">
      <header>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <clipPath id="brand-overlap"><circle cx="9.5" cy="9.5" r="7" /></clipPath>
          <circle cx="9.5" cy="9.5" r="7" fill="#2b5cff" />
          <circle cx="14.5" cy="14.5" r="7" fill="#ff4a1f" />

        </svg>
      </header>
      <form>
        <div class="hero">
          <span class="glow blue"></span>
          <span class="glow coral"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <clipPath id="overlap"><circle class="meet-blue" cx="9.5" cy="9.5" r="7" /></clipPath>
            <circle class="meet-blue" cx="9.5" cy="9.5" r="7" fill="#2b5cff" />
            <circle class="meet-coral" cx="14.5" cy="14.5" r="7" fill="#ff4a1f" />
            <circle
              class="meet-coral"
              cx="14.5"
              cy="14.5"
              r="7"
              clip-path="url(#overlap)"
              fill="var(--overlap)"
            />
          </svg>
        </div>
        <h1>Pair this browser</h1>
        <p>
          On <span id="host">your computer</span>, open Settings, then Connections, and choose Pair
          a device. Enter the code it shows. A paired browser has full control of that computer.
        </p>
        <input aria-label="Code" placeholder="7KQ-4M2" autocomplete="one-time-code" required />
        <button type="submit">Pair</button>
        <p role="alert"></p>
      </form>
    </main>
    <script type="module" src="./web.ts"></script>
  </body>
</html>
