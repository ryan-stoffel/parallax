name: Doctor report
description: Filed with `npx plx-connect doctor`, where a coding agent investigated the computer. The agent follows this structure.
labels:
  - via-doctor
body:
  - type: markdown
    attributes:
      value: |
        `plx-connect doctor` agents follow this structure. Keep one problem per issue, and
        redact keys, tokens, and home folder paths from anything you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in logs, the store, and Parallax's source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal, deterministic repro, if one was found.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The Parallax or plxd version the problem happened on, not plx-connect's, or unknown.
      placeholder: 2610.11822.14456-nightly
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, how Parallax runs (app, plxd alone, SSH host, Connect), and agent CLI versions if relevant.
      placeholder: macOS 27.0, app with its login service, claude 2.1.303
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The most relevant log lines, store rows, or stack traces only. Redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this isn't a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the computer to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model wrote this report.
      placeholder: Claude Code (claude-opus-5-5) via plx-connect doctor
