name: screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: capture
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ZIP: dist/editor/wisp-darwin-arm64.zip
    outputs:
      same-repo: ${{ steps.source.outputs.same-repo }}
      build: ${{ steps.build.outcome }}
      capture: ${{ steps.capture.outcome }}
    steps:
      - name: Skip pull requests from forks
        id: source
        timeout-minutes: 1
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Screenshots skipped::The head branch is in ${HEAD_REPO:-a deleted fork}, not $GITHUB_REPOSITORY. Pull requests from forks get a read-only GITHUB_TOKEN, so this workflow cannot push to ci-screenshots or comment on the pull request."
          fi

      - name: Check out the head commit
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The same key as ci.yml's app (arm64) job, so a push that changes no fork input reuses its build.
      # The cache only saves time, so without a key the job builds the app instead.
      - name: Hash the inputs of the app build
        id: inputs
        if: steps.source.outputs.same-repo == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          key=$(scripts/ci/app-cache-key arm64)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Restore only: ci.yml's app job is the one writer of this cache, and it saves only builds that pass check-app.
      - name: Restore the app that ci.yml built from the same inputs
        id: cached
        if: steps.source.outputs.same-repo == 'true' && steps.inputs.outputs.key != ''
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIP }}
          key: ${{ steps.inputs.outputs.key }}

      - name: Set up Node
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.cached.outputs.cache-hit != 'true' && 'npm' || '' }}
          # Upstream's lockfiles exist only after scripts/editor/prepare runs, and the pin decides them.
          cache-dependency-path: editor/upstream.json

      # build-app also builds wispd (#62), only needed on a miss. The key matches ci.yml's rust
      # and app jobs, so all three can share one cached toolchain download.
      - name: Cache Rust toolchain
        if: steps.source.outputs.same-repo == 'true' && steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Rust toolchain
        if: steps.source.outputs.same-repo == 'true' && steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: rustup toolchain install --no-self-update

      # On a miss, upstream's build calls GitHub's API, which rate-limits anonymous calls from shared runners.
      # The token is this job's contents: read token, and it expires when the job ends, before publish reads the log.
      - name: Build the app, or unpack the cached build
        id: build
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 60
        env:
          CACHED: ${{ steps.cached.outputs.cache-hit }}
          KEY: ${{ steps.inputs.outputs.key }}
          GITHUB_TOKEN: ${{ steps.cached.outputs.cache-hit != 'true' && github.token || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/capture/logs" "$RUNNER_TEMP/app"
          log=$RUNNER_TEMP/capture/logs/build.log
          if [ "$CACHED" = true ]; then
            echo "Unpacking the app that ci.yml's app job built from the same inputs ($KEY)" | tee "$log"
            ditto -x -k "$ZIP" "$RUNNER_TEMP/app" 2>&1 | tee -a "$log"
            bundle=$RUNNER_TEMP/app/Wisp.app
            echo "- App: restored from ci.yml's cache, key \`$KEY\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No cached build of these inputs (${KEY:-no key}); building the app" | tee "$log"
            scripts/ci/build-app arm64 2>&1 > "$RUNNER_TEMP/app-path" | tee -a "$log"
            bundle=$(cat "$RUNNER_TEMP/app-path")
            echo "- App: built here, because ci.yml's cache had no build for key \`${KEY:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "WISP_APP_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Capture the scenarios
        id: capture
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 20
        run: scripts/ci/screenshots "$RUNNER_TEMP/capture/screenshots" 2>&1 | tee "$RUNNER_TEMP/capture/logs/capture.log"

      - name: Upload the captures
        if: ${{ !cancelled() && steps.source.outputs.same-repo == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/capture
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # windows-2022 has Visual Studio 2022, which editor/vscode/build/npm/preinstall.ts accepts.
  # windows-2025 has Visual Studio 2026, so compiling there throws "Invalid C/C++ Compiler Toolchain".
  # This job is the only place that builds the Windows package. capture-windows only launches the zip.
  package-windows:
    name: package-windows
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Skip pull requests from forks
        id: source
        timeout-minutes: 1
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Windows package skipped::The head branch is in ${HEAD_REPO:-a deleted fork}, not $GITHUB_REPOSITORY."
          fi

      - name: Check out the head commit
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Hash the inputs of the Windows package
        id: inputs
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 2
        run: |
          git ls-files -s -- editor scripts/editor .nvmrc > "$RUNNER_TEMP/win-inputs.txt"
          hash=$(openssl dgst -sha256 "$RUNNER_TEMP/win-inputs.txt" | awk '{print $NF}')
          echo "key=wisp-app-win32-x64-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore or save the packaged app
        id: cached
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/editor/wisp-win32-x64.zip
          key: ${{ steps.inputs.outputs.key }}

      - name: Set up Node
        if: steps.source.outputs.same-repo == 'true' && steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: editor/upstream.json

      - name: Build the Windows app
        id: build
        if: steps.source.outputs.same-repo == 'true' && steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          scripts/editor/prepare
          cd editor/vscode
          npm ci --no-audit --no-fund
          npm run download-builtin-extensions
          CI=true npm run gulp vscode-win32-x64-min
          if [ ! -f ../VSCode-win32-x64/Wisp.exe ]; then
            find .. -maxdepth 3 -name '*.exe' -print >&2 || true
            echo "gulp did not produce ../VSCode-win32-x64/Wisp.exe" >&2
            exit 1
          fi
          cd ..
          mkdir -p ../dist/editor
          7z a -tzip -mx=1 ../dist/editor/wisp-win32-x64.zip ./VSCode-win32-x64
          echo "- App: built here, because the cache had no Windows package for key \`${{ steps.inputs.outputs.key }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Note the restored package
        if: steps.source.outputs.same-repo == 'true' && steps.cached.outputs.cache-hit == 'true'
        timeout-minutes: 1
        run: |
          echo "- App: restored packaged Windows build, key \`${{ steps.inputs.outputs.key }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the packaged app
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-win32-x64
          path: dist/editor/wisp-win32-x64.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Launch the packaged app. This runner does not compile the editor, even when the zip is missing.
  capture-windows:
    name: capture-windows
    needs: package-windows
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Skip pull requests from forks
        id: source
        timeout-minutes: 1
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Windows screenshots skipped::The head branch is in ${HEAD_REPO:-a deleted fork}, not $GITHUB_REPOSITORY."
          fi

      - name: Check out the head commit
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download the packaged app
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wisp-win32-x64
          path: dist/editor

      - name: Capture the blank window
        id: capture
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 20
        env:
          WISP_SCREENSHOT_ONLY: startup
        run: |
          set -eux
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/app" "$temp/capture/logs"
          # 7z is a Windows program, so the output directory is a Windows path.
          7z x dist/editor/wisp-win32-x64.zip -o"$(cygpath -m "$temp/app")" -y
          exe="$temp/app/VSCode-win32-x64/Wisp.exe"
          if [ ! -f "$exe" ]; then
            find "$temp/app" -name '*.exe' -print >&2 || true
            echo "the packaged app has no VSCode-win32-x64/Wisp.exe" >&2
            exit 1
          fi
          export WISP_APP_DIR
          WISP_APP_DIR=$(cygpath -m "$temp/app/VSCode-win32-x64")
          scripts/ci/screenshots "$temp/capture/screenshots" 2>&1 | tee "$temp/capture/logs/capture.log"

      - name: Upload the Windows capture
        if: ${{ !cancelled() && steps.source.outputs.same-repo == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/capture
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # The only job with a write token. Keep npm install, builds, and PR code that is not publish-screenshots
  # out of it, and treat the artifact as untrusted input (scripts/ci/README.md, Screenshots).
  publish:
    name: publish
    needs: [capture, capture-windows]
    if: ${{ !cancelled() && needs.capture.outputs.same-repo == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the publish script
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            ci/screenshots/src

      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the captures
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/capture

      - name: Download the Windows capture
        id: windows
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/capture-windows

      - name: Keep the Windows startup image with the macOS captures
        if: steps.windows.outcome == 'success'
        timeout-minutes: 1
        run: |
          src="${RUNNER_TEMP}/capture-windows/screenshots"
          dest="${RUNNER_TEMP}/capture/screenshots"
          if [ -f "$src/manifest.json" ] && node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const captured = Array.isArray(manifest.results) && manifest.results.some((result) => result.name === "startup" && result.status === "captured" && result.file === "startup.png");
            process.exit(captured ? 0 : 1);
          ' "$src/manifest.json"; then
            cp "$src/startup.png" "$dest/windows.png"
          else
            echo "Windows capture did not produce startup.png"
          fi

      - name: Publish the screenshots
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_OUTCOME: ${{ needs.capture.outputs.build }}
          CAPTURE_OUTCOME: ${{ needs.capture.outputs.capture }}
        run: scripts/ci/publish-screenshots "$RUNNER_TEMP/capture/screenshots" --logs "$RUNNER_TEMP/capture/logs"
