name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a PR cancels its running check. Each push to develop or main gets its own group,
# because a shared group cancels a pending run whenever a newer one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # wispd on every OS and arch its hosts run (0023): macOS arm64, Linux x86_64 and arm64 (RYA-17).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-6vcpu-macos-26, blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - name: Lint, type-check, build, and test
        run: scripts/ci/check-rust

      # The Ubuntu images may ship only the ssh client.
      - name: Install sshd
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi

      # scripts/ci/ssh-localhost sets up key-based ssh to localhost; check-ssh-attach runs
      # `wispd attach` through it (#95). On a runner, "ssh not ready" fails instead of skipping.
      - name: Check wispd attach over ssh
        env:
          WISP_E2E_REQUIRE_SSH: "1"
        run: |
          status=$(mktemp)
          scripts/ci/ssh-localhost "$status"
          scripts/ci/check-ssh-attach "$status" "$PWD/target/debug/wispd"

  # The desktop app on every OS it ships to (0022): checked, built, then launched (RYA-84).
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-6vcpu-macos-26, blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/desktop/.node-version

      # corepack provides the pnpm pinned in package.json's packageManager.
      - name: Install pnpm
        id: pnpm
        working-directory: apps/desktop
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install, check, test, and build
        run: scripts/ci/check-app

      # Electron's binary, which launch-app downloads here on a miss. Keyed on the installed version.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/node_modules/electron/package.json') }}

      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs.
      # Lift that on the runner instead of launching with --no-sandbox.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Launch the app
        env:
          electron_config_cache: ${{ runner.temp }}/electron
        run: scripts/ci/launch-app

  # The app against a wispd running its fake backend, with Playwright (RYA-16). macOS only until
  # wispd runs on Linux and Windows (RYA-25).
  e2e:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/desktop/.node-version

      - name: Install pnpm
        id: pnpm
        working-directory: apps/desktop
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      # Keyed on the lockfile, since e2e-app installs node_modules only after this step.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron
          key: electron-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      - name: Run the end-to-end tests
        env:
          electron_config_cache: ${{ runner.temp }}/electron
        run: scripts/ci/e2e-app

  actionlint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

      - name: Require ci to need every other job
        run: |
          workflow_jobs=$(yq -o=json '.jobs' .github/workflows/ci.yml)
          if ! jq -e '(keys - ["ci"]) == (.ci.needs | sort)' <<< "$workflow_jobs" > /dev/null; then
            echo "::error file=.github/workflows/ci.yml::ci.needs must list exactly the other jobs: $(jq -c 'keys - ["ci"]' <<< "$workflow_jobs")"
            exit 1
          fi

  # Branch protection requires this job's name, ci, as the only check (#6). Renaming it blocks every merge.
  ci:
    if: always()
    needs: [actionlint, app, e2e, rust]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'to_entries | all(.value.result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Every job in ci.yml must succeed."
            exit 1
          fi
