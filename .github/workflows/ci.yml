name: CI

# Pull requests only: develop and main take changes only through PRs that passed these checks, so a
# push there runs just release.yml's build.
on:
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its running check.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # plxd on every OS and arch its hosts run (0023): macOS arm64, Linux x86_64 and arm64 (RYA-17),
  # and Windows x86_64 and arm64 (RYA-21).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # The Windows arm64 image may not ship rustup.
      - name: Install rustup
        if: runner.os == 'Windows'
        run: |
          if ! command -v rustup > /dev/null; then
            arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustup-init.exe" \
              "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal --no-modify-path
            printf '%s\\.cargo\\bin\n' "$USERPROFILE" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}

      # What Claude Code's worker sandbox needs on Linux (0013): bubblewrap, socat, and the AppArmor
      # profile from Claude Code's docs that lets bwrap make user namespaces. Plus a pinned Claude
      # Code, which the sandbox tests run against a fake API (RYA-20), and zsh, whose startup the
      # PATH test makes reset PATH (RYA-126).
      - name: Install the Linux worker sandbox
        if: runner.os == 'Linux'
        env:
          CLAUDE_VERSION: 2.1.283
          CLAUDE_SHA256_X64: 1859583ce32920595c61ef868bee52e1b1594f7486db209935e01f1e5e804ae2
          CLAUDE_SHA256_ARM64: 346d294f0103d6fc0de11ac953579b5c62dfa90698a4cfc486b6f927c615e697
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat zsh
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            platform=linux-arm64 sha256=$CLAUDE_SHA256_ARM64
          else
            platform=linux-x64 sha256=$CLAUDE_SHA256_X64
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_VERSION/$platform/claude"
          echo "$sha256  $RUNNER_TEMP/claude" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/claude"
          echo "PLX_SANDBOX_CLAUDE=$RUNNER_TEMP/claude" >> "$GITHUB_ENV"

      - name: Lint, type-check, build, and test
        run: scripts/ci/check-rust

      # The Ubuntu images may ship only the ssh client.
      - name: Install sshd
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi

      # scripts/ci/ssh-localhost sets up key-based ssh to localhost; check-ssh-attach runs
      # `plxd attach` through it (#95). On a runner, "ssh not ready" fails instead of skipping.
      - name: Check plxd attach over ssh
        if: runner.os != 'Windows'
        env:
          PLX_E2E_REQUIRE_SSH: "1"
        run: |
          status=$(mktemp)
          scripts/ci/ssh-localhost "$status"
          scripts/ci/check-ssh-attach "$status" "$PWD/target/debug/plxd"

      # The same check through Windows' own OpenSSH server, which puts each session in a job
      # object that `serve` must break away from (0023).
      - name: Set up ssh to localhost
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/ssh-localhost.ps1 -StatusFile "$env:RUNNER_TEMP\ssh-status"

      - name: Check plxd attach over Windows OpenSSH
        if: runner.os == 'Windows'
        env:
          PLX_E2E_REQUIRE_SSH: "1"
        run: |
          scripts/ci/check-ssh-attach "$RUNNER_TEMP\\ssh-status" "$(cygpath -w "$PWD/target/debug/plxd.exe")"

      # The e2e job's plxd, so it doesn't build its own (RYA-25). The feature only changes the
      # plxd crate, so this rebuilds just that.
      - name: Build plxd with the fake backend
        run: cargo build -p plxd --locked --features fake-backend

      - name: Upload plxd
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plxd-${{ matrix.os }}
          path: target/debug/plxd${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  # The desktop app on every OS it ships to (0022): checked, built, then launched (RYA-84).
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/desktop/.node-version

      # corepack provides the pnpm pinned in package.json's packageManager.
      - name: Install pnpm
        id: pnpm
        working-directory: apps/desktop
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install, check, test, and build
        run: scripts/ci/check-app

      # Electron's binary, which launch-app downloads here on a miss. Keyed on the installed version.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/node_modules/electron/package.json') }}

      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs.
      # Lift that on the runner instead of launching with --no-sandbox.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Launch the app
        env:
          electron_config_cache: ${{ runner.temp }}/electron
        run: scripts/ci/launch-app

  # The app against a plxd running its fake backend, with Playwright (RYA-16), on the OSes the app
  # job covers, with the plxd the rust job built for that OS (RYA-25).
  e2e:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plxd-${{ matrix.os }}
          path: ${{ runner.temp }}/plxd

      # e2e-app runs the tests against PLXD_PATH. Artifacts drop the executable bit.
      - name: Point the tests at plxd
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo "PLXD_PATH=$RUNNER_TEMP\\plxd\\plxd.exe" >> "$GITHUB_ENV"
          else
            chmod +x "$RUNNER_TEMP/plxd/plxd"
            echo "PLXD_PATH=$RUNNER_TEMP/plxd/plxd" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/desktop/.node-version

      - name: Install pnpm
        id: pnpm
        working-directory: apps/desktop
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      # Keyed on the lockfile, since e2e-app installs node_modules only after this step.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron
          key: electron-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      # As in the app job.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the end-to-end tests
        env:
          electron_config_cache: ${{ runner.temp }}/electron
        run: scripts/ci/e2e-app

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

      - name: Test the release plan
        run: scripts/ci/plan-release.test

      - name: Require ci to need every other job
        run: |
          workflow_jobs=$(yq -o=json '.jobs' .github/workflows/ci.yml)
          if ! jq -e '(keys - ["ci"]) == (.ci.needs | sort)' <<< "$workflow_jobs" > /dev/null; then
            echo "::error file=.github/workflows/ci.yml::ci.needs must list exactly the other jobs: $(jq -c 'keys - ["ci"]' <<< "$workflow_jobs")"
            exit 1
          fi

  # Branch protection requires this job's name, ci, as the only check (#6). Renaming it blocks every merge.
  ci:
    if: always()
    needs: [actionlint, app, e2e, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'to_entries | all(.value.result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Every job in ci.yml must succeed."
            exit 1
          fi
