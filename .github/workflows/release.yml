name: Release

# The two release channels (0028): a nightly prerelease per push to develop and a standard release
# per push to main, each with the packaged app for the five targets attached (0029). Only this
# workflow can write to the repository's releases. It builds and publishes; it runs no tests or
# lint, because the PR that landed the commit already passed CI.
on:
  push:
    branches: [develop, main]
  # Runs the plan and the builds on any branch, and never publishes. Proves the pipeline before merge.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, so each release's notes start at the one before it. If pushes
# queue up, the newest waits and the ones between are skipped; their PRs still land in its notes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # The pushed commit's date, not the run's, so a re-run of an old commit finds its own tag.
  # Empty on workflow_dispatch, where `plan` asks the API instead.
  COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

jobs:
  # The tag, the channel, and the version for this commit, and whether a build is needed at all.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Plan the release
        id: plan
        run: |
          timestamp=${COMMIT_TIMESTAMP:-$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .commit.committer.date)}
          date=${timestamp:0:10}
          # Only main is the standard channel. Any other branch, from workflow_dispatch, builds
          # as a nightly.
          channel=nightly
          if [ "$GITHUB_REF" = refs/heads/main ]; then channel=release; fi
          tag="$channel-${date//-/}-${GITHUB_SHA::7}"
          # The tag's date and sha as a semver prerelease. The g keeps a sha of only digits, which
          # may start with 0, from being a numeric identifier.
          version="0.0.0-$channel.${date//-/}.g${GITHUB_SHA::7}"
          build=true
          # A published release means this commit was already built and shipped: nothing to do.
          if [ "$GITHUB_EVENT_NAME" = push ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published."
            build=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  # The installer on each target's own runner (0023, 0029), the same five as ci.yml's rust job.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WISP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # The Windows arm64 image may not ship rustup.
      - name: Install rustup
        if: runner.os == 'Windows'
        run: |
          if ! command -v rustup > /dev/null; then
            arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustup-init.exe" \
              "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal --no-modify-path
            printf '%s\\.cargo\\bin\n' "$USERPROFILE" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ runner.os }}-${{ runner.arch }}

      # The static musl wispd (0023) compiles bundled SQLite with musl-gcc.
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/desktop/.node-version

      # corepack provides the pnpm pinned in package.json's packageManager.
      - name: Install pnpm
        id: pnpm
        working-directory: apps/desktop
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Package the app
        run: scripts/ci/package-app

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.os }}
          path: |
            apps/desktop/release/wisp-*.dmg
            apps/desktop/release/wisp-*.exe
            apps/desktop/release/wisp-*.AppImage
          if-no-files-found: error
          retention-days: 7

  # Runs only after all five builds succeed, so a failed build publishes nothing.
  publish:
    needs: [plan, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: Publish the release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi
          (cd installers && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          # Nightly is a prerelease; the standard release is marked Latest (0028).
          prefix=${TAG%%-*}
          previous=$(gh release list --limit 1000 --json tagName |
            jq -r --arg tag "$TAG" --arg prefix "$prefix-" '[.[].tagName | select(startswith($prefix) and . != $tag)][0] // empty')
          args=(--target "$GITHUB_SHA" --generate-notes)
          if [ "$prefix" = nightly ]; then args+=(--prerelease); else args+=(--latest); fi
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          gh release create "$TAG" "${args[@]}" installers/* SHA256SUMS
