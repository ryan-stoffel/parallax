name: Release

# The two release channels (0028): a nightly prerelease per push to develop and a standard release
# per push to main, each with the packaged app for the five targets and the update metadata the
# app's updater reads attached (0029, 0030). The macOS app is signed and notarized. Only this
# workflow can write to the repository's releases. It builds and publishes; it runs no tests or
# lint, because the PR that landed the commit already passed CI.
on:
  push:
    branches: [develop, main]
  # Runs the plan and the builds on any branch, signing and notarizing included, and never
  # publishes. Proves the pipeline before merge.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, so each release's notes start at the one before it. If pushes
# queue up, the newest waits and the ones between are skipped; their PRs still land in its notes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The version, tag, and channel for this commit, and whether a build is needed at all.
  # Only plan and publish get a token: in the builds it made electron-builder try to publish.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Plan the release
        id: plan
        run: |
          # The version is the commit's committer time in UTC as YYMM.1DDHH.1MMSS (0030): the same
          # on a re-run, rising with every commit, and each part at most 65535 for Windows. The
          # leading 1s keep every tag the same length, because GitHub orders releases from the
          # same day by tag name as text, and the updater takes the first one it finds.
          t=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .commit.committer.date)
          [[ $t =~ ^20([0-9]{2})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})Z$ ]]
          m=("${BASH_REMATCH[@]}")
          version="${m[1]}${m[2]}.1${m[3]}${m[4]}.1${m[5]}${m[6]}"
          # Only main is the standard channel: electron-updater's `latest`. Any other branch, from
          # workflow_dispatch, builds as a nightly, a prerelease of the same time, so the standard
          # release of a commit is newer than its nightly.
          channel=nightly
          if [ "$GITHUB_REF" = refs/heads/main ]; then channel=latest; else version+=-nightly; fi
          tag=v$version
          build=true
          # A published release means this commit was already built and shipped: nothing to do.
          if [ "$GITHUB_EVENT_NAME" = push ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published."
            build=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "channel=$channel"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  # The installer on each target's own runner (0023, 0029), the same five as ci.yml's rust job.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WISP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # The Windows arm64 image may not ship rustup.
      - name: Install rustup
        if: runner.os == 'Windows'
        run: |
          if ! command -v rustup > /dev/null; then
            arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustup-init.exe" \
              "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal --no-modify-path
            printf '%s\\.cargo\\bin\n' "$USERPROFILE" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ runner.os }}-${{ runner.arch }}

      # The static musl wispd (0023) compiles bundled SQLite with musl-gcc.
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/desktop/.node-version

      # corepack provides the pnpm pinned in package.json's packageManager.
      - name: Install pnpm
        id: pnpm
        working-directory: apps/desktop
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Package the app
        if: runner.os != 'macOS'
        run: scripts/ci/package-app

      # The signing secrets reach only this step and the next. electron-builder signs everything in
      # the bundle with the Developer ID certificate and the hardened runtime, then notarizes and
      # staples the app, before it builds the dmg and zip (0030). The certificate goes into a
      # keychain made here and named by CSC_KEYCHAIN: electron-builder 26.15.3's own CSC_LINK
      # import unlocks its keychain with the certificate's password, which fails.
      - name: Package, sign, and notarize the app
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          CSC_KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$CSC_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CSC_KEYCHAIN"
          security unlock-keychain -p "$password" "$CSC_KEYCHAIN"
          (umask 077 && printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -k "$CSC_KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$CSC_KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$CSC_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          export CSC_KEYCHAIN APPLE_API_KEY
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8
          scripts/ci/package-app

      # The dmg was signed in the build but can only be notarized as a file, after it. Stapling
      # changes its bytes, which is why it isn't in the update metadata. Any failure fails the job.
      - name: Notarize the dmg and verify the app
        if: runner.os == 'macOS'
        working-directory: apps/desktop/release
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key=$RUNNER_TEMP/apple-api-key.p8
          dmg=(wisp-*.dmg)
          result=$(xcrun notarytool submit "${dmg[0]}" --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json) || true
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" --key "$key" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          codesign --verify --deep --strict --verbose=2 mac-arm64/Wisp.app
          spctl --assess --type execute --verbose mac-arm64/Wisp.app
          xcrun stapler validate mac-arm64/Wisp.app

      # The installers, the macOS zip the updater installs from, the blockmaps for differential
      # downloads, and the channel's update metadata (0030).
      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.os }}
          path: |
            apps/desktop/release/wisp-*
            apps/desktop/release/latest*.yml
            apps/desktop/release/nightly*.yml
          if-no-files-found: error
          retention-days: 7

  # Runs only after all five builds succeed, so a failed build publishes nothing.
  publish:
    needs: [plan, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # One folder per build, since both Windows builds write the same <channel>.yml.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          path: builds

      - name: Publish the release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi
          mkdir assets
          # electron-updater on Windows reads one <channel>.yml and installs the file whose name has
          # its arch, so the x64 and arm64 lists become one (0030).
          ruby -ryaml -e 'x64 = YAML.load_file(ARGV[0]); x64["files"] += YAML.load_file(ARGV[1])["files"]; File.write(ARGV[2], x64.to_yaml)' \
            "builds/installer-windows-2025/$CHANNEL.yml" "builds/installer-windows-11-arm/$CHANNEL.yml" "assets/$CHANNEL.yml"
          rm "builds/installer-windows-2025/$CHANNEL.yml" "builds/installer-windows-11-arm/$CHANNEL.yml"
          # Every other file name is unique to its build; -n leaves behind any that isn't.
          mv -n builds/*/* assets/
          if [ -n "$(find builds -type f)" ]; then echo "Two builds wrote the same file:"; find builds -type f; exit 1; fi
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          # Notes start at the channel's previous release, including the date-sha tags from before
          # 0030 (nightly-*, release-*). Nightly is a prerelease; standard is marked Latest (0028).
          if [ "$CHANNEL" = nightly ]; then
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+-nightly$|^nightly-'
            args=(--prerelease)
          else
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+$|^release-'
            args=(--latest)
          fi
          previous=$(gh release list --limit 1000 --json tagName |
            jq -r --arg tag "$TAG" --arg pattern "$pattern" '[.[].tagName | select(test($pattern) and . != $tag)][0] // empty')
          args+=(--target "$GITHUB_SHA" --generate-notes)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          # A release goes public before its uploads finish. If one fails, remove the release and
          # its tag, so the re-run publishes it again instead of finding half of it.
          if ! gh release create "$TAG" "${args[@]}" assets/* SHA256SUMS; then
            gh release delete "$TAG" --cleanup-tag --yes || true
            exit 1
          fi
