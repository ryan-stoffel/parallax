# Parallax Relay (PLX-652, decision 0068). README.md has the deploy steps and what they need.
#
# The top level is production. `pnpm dev` runs `[env.dev]`. Both take Clerk's production and
# development instances.
name = "parallax-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# relay.parallax.codes, on the account's parallax.codes zone, and no workers.dev URL.
routes = [{ pattern = "relay.parallax.codes", custom_domain = true }]
workers_dev = false

# Clerk's production and development instances (0067), in that order, each with its JWKS and the
# desktop app's OAuth application, whose access tokens the relay accepts. All public. The apps use
# development until the account move ships (PLX-1465), and it leaves only after that, PLX-1457,
# and a stable release carrying both (README.md).
[vars]
CLERK_ISSUER = "https://clerk.parallax.codes,https://adjusted-mastodon-8705.clerk.accounts.dev"
CLERK_JWKS_URL = "https://clerk.parallax.codes/.well-known/jwks.json,https://adjusted-mastodon-8705.clerk.accounts.dev/.well-known/jwks.json"
CLERK_CLIENT_IDS = "mp9Q72aAbB0LC83O,SXDueyOLOJ2v4Vmq"

# Workers Logs keeps every console line, which `src/log.ts` keeps free of ids and tokens (PLX-1349).
[observability]
enabled = true

# Invocation logs stay off: each holds its request's URL, and those carry full host ids, webhook
# tokens, and stream tokens.
[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "HOSTS"
class_name = "HostRelay"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserAccount"

# One per client stream, so one stream's bytes don't queue behind another's (0091).
[[durable_objects.bindings]]
name = "STREAMS"
class_name = "StreamRelay"

# Anonymous requests per address and host, before they reach a host's object.
[[ratelimits]]
name = "ANON"
namespace_id = "6520"
simple = { limit = 120, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay", "UserAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StreamRelay"]

# For `wrangler dev`: Clerk's production instance and its development one (0067), in that order,
# so builds signed in to either work against it.
[env.dev]
workers_dev = true
routes = []

[env.dev.vars]
CLERK_ISSUER = "https://clerk.parallax.codes,https://adjusted-mastodon-8705.clerk.accounts.dev"
CLERK_JWKS_URL = "https://clerk.parallax.codes/.well-known/jwks.json,https://adjusted-mastodon-8705.clerk.accounts.dev/.well-known/jwks.json"
CLERK_CLIENT_IDS = "mp9Q72aAbB0LC83O,SXDueyOLOJ2v4Vmq"

[[env.dev.durable_objects.bindings]]
name = "HOSTS"
class_name = "HostRelay"

[[env.dev.durable_objects.bindings]]
name = "USERS"
class_name = "UserAccount"

[[env.dev.durable_objects.bindings]]
name = "STREAMS"
class_name = "StreamRelay"

[[env.dev.ratelimits]]
name = "ANON"
namespace_id = "6520"
simple = { limit = 120, period = 60 }

# Staging (PLX-1495): a second Worker, `parallax-relay-staging`, on its `workers.dev` URL, for
# agents to deploy to and measure. Deploy it only with `pnpm deploy:staging` (README.md). Its
# Durable Objects are its own Worker's, so it shares no storage with production, and it has no
# route on `parallax.codes`. It takes the same Clerk instances as production, and serves only the
# relay probe's test account: `REQUIRE_ALLOWED_USERS` makes it refuse everyone its `ALLOWED_USERS`
# secret doesn't list, so it stays closed when that secret is missing. The migrations and
# observability settings are the top level's, which every environment inherits.
[env.staging]
name = "parallax-relay-staging"
workers_dev = true
preview_urls = false
routes = []

[env.staging.vars]
REQUIRE_ALLOWED_USERS = "1"
PLX1493_EXPERIMENT = "no-alarms"
CLERK_ISSUER = "https://clerk.parallax.codes,https://adjusted-mastodon-8705.clerk.accounts.dev"
CLERK_JWKS_URL = "https://clerk.parallax.codes/.well-known/jwks.json,https://adjusted-mastodon-8705.clerk.accounts.dev/.well-known/jwks.json"
CLERK_CLIENT_IDS = "mp9Q72aAbB0LC83O,SXDueyOLOJ2v4Vmq"

[[env.staging.durable_objects.bindings]]
name = "HOSTS"
class_name = "HostRelay"

[[env.staging.durable_objects.bindings]]
name = "USERS"
class_name = "UserAccount"

[[env.staging.durable_objects.bindings]]
name = "STREAMS"
class_name = "StreamRelay"

# Its own namespace, so staging's counts and production's stay apart.
[[env.staging.ratelimits]]
name = "ANON"
namespace_id = "1495"
simple = { limit = 120, period = 60 }
