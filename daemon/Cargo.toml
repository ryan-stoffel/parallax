[package]
name = "wispd"
description = "The wisp host daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# `fake-backend` lets `WISPD_FAKE_BACKEND` run workers on the fake backend, for the app's end-to-end
# tests (RYA-16). Test builds only: it refuses to compile without debug assertions.
[features]
fake-backend = []

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true, features = ["sink", "std"] }
jiff = { workspace = true, features = ["serde", "tz-system", "tzdb-zoneinfo"] }
notify.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
uuid.workspace = true
wisp-protocol = { path = "../crates/wisp-protocol" }
wisp-store = { path = "../crates/wisp-store" }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal"] }
rustix = { workspace = true, features = ["fs", "process"] }

# Agent CLIs run through tokio's process support, and every Win32 call wispd makes is in
# `src/windows.rs` (0023).
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["process"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The Keychain (0004) and FSEvents (0005) are macOS's. On Linux, notify's default backend is
# inotify, and on Windows ReadDirectoryChangesW (0023).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { workspace = true, features = ["macos_fsevent"] }
security-framework.workspace = true

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { workspace = true, features = ["process"] }
