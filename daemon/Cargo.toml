[package]
name = "plxd"
description = "The Parallax host daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# `fake-backend` lets `PLXD_FAKE_BACKEND` run workers on the fake backend, for the app's end-to-end
# tests (PLX-16). Test builds only: it refuses to compile without debug assertions.
[features]
fake-backend = []

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true, features = ["sink", "std"] }
jiff = { workspace = true, features = ["serde", "tz-system", "tzdb-zoneinfo"] }
notify.workspace = true
# The terminals plxd runs (PLX-637): a pseudo-terminal on macOS and Linux, ConPTY on Windows.
portable-pty = "0.9.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
# `v4` for the random password of an `opencode serve` plxd starts (PLX-559).
uuid = { workspace = true, features = ["v4"] }
parallax-protocol = { path = "../crates/parallax-protocol" }
parallax-store = { path = "../crates/parallax-store" }
# Reads Cursor desktop's sign-in for `usage/daily` (0039). The store already builds it.
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize.workspace = true
# Remote access on the LAN (PLX-641, 0065): HTTPS and WebSocket with a pinned self-signed key,
# and ES256 DPoP proofs, all on ring, not aws-lc-rs, which would need CMake and NASM. ring's build
# needs a C compiler, as rusqlite's bundled SQLite already does, and clang on Windows arm64.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# Its HTTP requests and base64url. tungstenite already builds both.
httparse = "1"
data-encoding = "2"
# Pairing codes and session tokens. tempfile and uuid already build it.
getrandom = "0.4"
# Pairing with a short code: SPAKE2 vouches for the host's certificate, and mDNS finds hosts
# waiting to pair. Both pure Rust.
spake2 = "0.4"
mdns-sd = { version = "0.21", default-features = false }

[target.'cfg(unix)'.dependencies]
# `net` for the browser proxy's view of this machine's own addresses (PLX-639).
nix = { workspace = true, features = ["net", "process", "signal"] }
rustix = { workspace = true, features = ["fs", "process", "system"] }

# Agent CLIs run through tokio's process support, and every Win32 call plxd makes is in
# `src/windows.rs` (0023).
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["process"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The Keychain (0004) and FSEvents (0005) are macOS's. On Linux, notify's default backend is
# inotify, and on Windows ReadDirectoryChangesW (0023).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { workspace = true, features = ["macos_fsevent"] }
security-framework.workspace = true

# API keys go in the Secret Service over D-Bus, in pure Rust: tokio and Rust crypto only, so the
# static musl build links neither libdbus nor OpenSSL (0023).
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "test-util"] }
