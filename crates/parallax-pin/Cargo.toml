[package]
name = "parallax-pin"
description = "Which plxd certificate a client accepts, shared by plxd and the browser's TLS (0108)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustls-pki-types = { version = "1", default-features = false }
ring = "0.17"
# Only to parse a certificate's key, with the same parse rustls checks the handshake with. It
# needs no crypto provider, so it builds for wasm32 too.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
